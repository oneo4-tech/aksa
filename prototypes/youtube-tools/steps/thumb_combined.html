<!doctype html>
<!-- PROTOTYPE: thumbnail designed by Claude as SVG, combined: Claude SVG layout + Gemini text-free art -->
<meta charset="utf-8">
<style>
  * { margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: #0b0f14; }
  svg { display: block; }
</style>
<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ee66b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2ee66b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#b3121f"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c24"/>
      <stop offset="1" stop-color="#0f141a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a222c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- terminal card, right -->
  <g filter="url(#shadow)" transform="rotate(3 990 360)">
    <rect x="740" y="120" width="500" height="470" rx="22" fill="url(#term)" stroke="#2a3441" stroke-width="3"/>
    <circle cx="776" cy="152" r="9" fill="#ff5f57"/><circle cx="804" cy="152" r="9" fill="#febc2e"/><circle cx="832" cy="152" r="9" fill="#28c840"/>
    <g font-family="Menlo, ui-monospace, monospace" font-size="30" font-weight="700">
      <text x="776" y="225" fill="#6e7b8b">$ pytest</text>
      <text x="776" y="275" fill="#2ee66b">test_discount PASSED</text>
      <text x="776" y="325" fill="#2ee66b">test_runs     PASSED</text>
      <text x="776" y="395" fill="#2ee66b" font-size="40">2 passed ✓</text>
    </g>
    <line x1="776" y1="430" x2="1200" y2="430" stroke="#2a3441" stroke-width="3"/>
    <text x="776" y="480" font-family="Menlo, ui-monospace, monospace" font-size="26" fill="#6e7b8b">code: price × 1.1 ?!</text>
  </g>

  <!-- Gemini art, edges faded into the background -->
  <mask id="fade"><radialGradient id="mg"><stop offset=".6" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <rect x="700" y="200" width="520" height="520" fill="url(#mg)"/></mask>
  <image href="../out/thumbs/gemini-3.1-flash-image-art.png" x="700" y="200" width="520" height="520" mask="url(#fade)"/>
  <!-- headline, left -->
  <ellipse cx="300" cy="200" rx="260" ry="120" fill="url(#glowGreen)"/>
  <g transform="rotate(-5 260 205)">
    <rect x="70" y="140" width="420" height="120" rx="24" fill="#1f9d4c" stroke="#2ee66b" stroke-width="5"/>
    <text x="280" y="226" text-anchor="middle" font-family="Menlo, ui-monospace, monospace" font-size="74" font-weight="800" fill="#fff">2 PASSED</text>
  </g>
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" letter-spacing="-4">
    <text x="64" y="440" font-size="150" fill="#ffffff" stroke="#000" stroke-width="6" paint-order="stroke">TESTS</text>
    <text x="64" y="590" font-size="150" fill="#ff3b3b" stroke="#000" stroke-width="6" paint-order="stroke">NOTHING</text>
  </g>
</svg>
</body>
