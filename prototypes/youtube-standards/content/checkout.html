<!doctype html><meta charset="utf-8"><title>PROTOTYPE checkout</title>
<style>body{font:28px -apple-system,sans-serif;background:#f6f8fa;display:grid;place-items:center;height:100vh;margin:0}
.card{background:#fff;padding:48px 64px;border-radius:20px;box-shadow:0 10px 40px #0002;width:720px}
h1{margin:0 0 28px}label{display:block;margin:18px 0 6px;color:#555}input{font-size:28px;padding:10px 14px;width:100%;box-sizing:border-box}
button{margin-top:28px;font-size:28px;font-weight:700;padding:14px 28px;background:#1f883d;color:#fff;border:0;border-radius:10px}
#total{margin-top:28px;font-size:40px;font-weight:800}</style>
<div class="card"><h1>Checkout</h1>
<label>Price</label><input id="price" value="">
<label>Discount %</label><input id="pct" value="">
<button id="apply">Apply discount</button><div id="total">Total: -</div></div>
<script>
// the bug: + instead of -
document.getElementById('apply').onclick = () => {
  const p = +price.value, d = +pct.value;
  total.textContent = 'Total: ' + (p * (1 + d / 100)).toFixed(2);
};
</script>
