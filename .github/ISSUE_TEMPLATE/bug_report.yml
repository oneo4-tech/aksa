name: Bug Report
description: Report a defect in aksa itself
title: "[bug] "
labels: ["bug", "type:fix"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Steps, commands, or code to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
      placeholder: "v0.2.0 or commit SHA"