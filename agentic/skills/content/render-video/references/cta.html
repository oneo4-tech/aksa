<!doctype html>
<!-- Scene kind "cta", the like, share, subscribe, and notification beat before the end: flat icons we draw (a thumb
     up, a share arrow, a bell, each on a round tile) and a subscribe pill in the palette's deep red with
     "Subscribe" in warm white; no YouTube logo. Each enters as the narration names it, then does one short move: the
     thumb is pressed and lights up, the share arrow pulses once, the pill is pressed, the bell swings once. A row on
     a long-form, two by two on a Short, above the caption band. render.py fills the placeholders. -->
<meta charset="utf-8">
<style>
/*{{fonts}}*/
/*{{css}}*/
.actions { position: absolute; left: var(--pad); right: var(--pad); top: calc(260 * var(--u)); bottom: var(--floor);
  display: flex; align-items: center; justify-content: center; gap: calc(80 * var(--u)); }
.action { display: flex; flex-direction: column; align-items: center; gap: calc(26 * var(--u)); opacity: 0; }
.slot { height: calc(200 * var(--u)); display: flex; align-items: center; }
.tile { width: calc(200 * var(--u)); height: calc(200 * var(--u)); border-radius: 50%; background: var(--panel);
  border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; }
.tile svg { width: calc(110 * var(--u)); height: calc(110 * var(--u)); overflow: visible; }
.pill { height: calc(130 * var(--u)); padding: 0 calc(64 * var(--u)); border-radius: calc(65 * var(--u)); display: flex;
  align-items: center; font-size: calc(56 * var(--u)); font-weight: 700; letter-spacing: 0.5px; }
.label { font-size: calc(40 * var(--u)); font-weight: 600; color: var(--fg); }
[data-shape="tall"] .actions { top: calc(420 * var(--u)); flex-wrap: wrap; align-content: center; gap: calc(60 * var(--u)) 0; }
[data-shape="tall"] .action { width: 50%; }
</style>
<body data-kind="cta">
<div id="stage"><div id="camera">
  <div class="grid"></div>
  <div class="brand" id="brand"></div>
  <h1 id="heading"></h1>
  <div class="actions" id="actions"></div>
</div></div>
<script>
/*{{cues}}*/
/*{{js}}*/
// Flat glyphs on a 24-unit box, filled: a thumb up with its cuff, a curved share arrow, and a bell with its clapper.
const GLYPHS = {
  like: 'M2.5 10 H6.5 V21 H2.5 Z M8.5 10 L12.6 3 C14.3 3 15.5 4.2 15.1 6 L14.4 9 H20 C21.3 9 22.2 10.2 21.9 11.4 L19.9 19.3 ' +
    'C19.6 20.3 18.7 21 17.6 21 H8.5 Z',
  share: 'M14 3.5 L22 11 L14 18.5 V14.2 C9.2 14.2 5.6 15.8 2.5 20.5 C3.4 13.6 7.2 8.9 14 7.9 Z',
  notify: 'M12 2.5 C8.4 2.5 6 5.3 6 9.2 V14.5 L3.8 17.8 H20.2 L18 14.5 V9.2 C18 5.3 15.6 2.5 12 2.5 Z M9.6 19.3 ' +
    'A2.4 2.4 0 0 0 14.4 19.3 Z',
};
const LABELS = { like: 'Like', share: 'Share', notify: 'Notifications' };

function glyph(parent, name, colour) {
  const svg = svgIn(parent), path = document.createElementNS(SVG, 'path');
  svg.setAttribute('viewBox', '0 0 24 24');
  path.setAttribute('d', GLYPHS[name]);
  path.style.fill = colour;
  svg.appendChild(path);
  return svg;
}

function build() {
  const p = CUES.palette, box = $('actions');
  CUES.actions.forEach(action => {
    const item = make('div', 'action', undefined, box), slot = make('div', 'slot', undefined, item);
    let moving;
    if (action.name === 'subscribe') {
      moving = make('div', 'pill', 'Subscribe', slot);
      Object.assign(moving.style, { background: p.syntax, color: p.text });
      boxed(moving, 'text');
      make('div', 'label', ' ', item);
    } else {
      const tile = make('div', 'tile', undefined, slot);
      moving = glyph(tile, action.name, p.text);
      boxed(make('div', 'label', LABELS[action.name], item), 'text');
    }
    enter(item, action.at, 'scale');
    // Its one short move once in place; multi-keyframe animations use linear timing (scene.js).
    const go = action.at + M.enter, once = { easing: 'linear', fill: 'forwards' };
    if (action.name === 'like') {
      at(moving, [{ transform: 'scale(1)' }, { transform: 'scale(0.86)' }, { transform: 'scale(1)' }], go, 0.35, once);
      at(moving.querySelector('path'), [{ fill: p.text }, { fill: p.accent }], go + 0.1, 0.2, { fill: 'forwards' });
    } else if (action.name === 'share') {
      at(moving, [{ transform: 'scale(1)' }, { transform: 'scale(1.14)' }, { transform: 'scale(1)' }], go, 0.4, once);
    } else if (action.name === 'subscribe') {
      at(moving, [{ transform: 'scale(1)' }, { transform: 'scale(0.93)' }, { transform: 'scale(1)' }], go, 0.35, once);
    } else {
      moving.style.transformOrigin = '50% 8%';
      at(moving, [0, 16, -12, 6, 0].map(a => ({ transform: `rotate(${a}deg)` })), go, 0.7, once);
    }
  });
}
</script>
</body>
