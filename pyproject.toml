[project]
name = "aksa"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mkdocs-material",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-plugin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agentic/scripts"]

[tool.ruff]
line-length = 120
