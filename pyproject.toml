[project]
name = "aksa"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.1",
    "pyyaml>=6.0",
    "markdown>=3.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mkdocs-material",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-plugin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agentic/scripts"]
addopts = "-m 'not media'"  # media tests take a minute; run them with: uv run pytest -m media
markers = [
    "media: renders real media with Chrome, ffmpeg, whisper-cli, and fonts; runs locally, skipped in CI (#28)",
]

[tool.ruff]
line-length = 120
