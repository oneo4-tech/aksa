[project]
name = "aksa"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "markdown>=3.11.2",
    "httpx>=0.27",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mkdocs-material",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-plugin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agentic/scripts"]

[tool.ruff]
line-length = 120
